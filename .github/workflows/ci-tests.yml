name: CI Tests

on:
  push:
    branches: [ ci-setup ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          pip install -r selenium-tests/requirements.txt
      - name: Run Selenium tests
        run: |
          cd selenium-tests
          pytest